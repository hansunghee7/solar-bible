# 클라우드 탐 알림 푸시(2026-10-08 탐 클라우드). 타미(헤르메스)가 수신 문서·완료 문서·결과 문서를 main에 올리면,
# 이 워크플로가 "[수신함]" 제목의 열린 PR에 댓글을 단다. 클라우드 세션이 그 PR을 구독하고 있으면 댓글이 wake 이벤트로 들어와
# 폴링 없이 알게 된다. 댓글 작성자가 github-actions[bot]이라 사람 계정(사장님)과 달라 "내 댓글은 알림이 안 온다" 문제를 피하는지 시험 중이다.
# 공개 저장소이므로 댓글에는 파일 경로와 커밋 제목만 쓴다(본문·비밀값·개인정보 없음).
name: notify-inbox
on:
  push:
    branches: [main]
    paths:
      - 'tasks/received/**'
      - 'tasks/done/**'
      - 'reports/*-result.md'
      - 'notify/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 수신함 PR에 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          pr=$(gh pr list --repo "$REPO" --state open --search "[수신함] in:title" --json number --jq '.[0].number')
          if [ -z "$pr" ]; then echo "수신함 PR 없음"; exit 0; fi
          title=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]')
          files=$(gh api "repos/$REPO/commits/$SHA" --jq '[.files[].filename] | map(select(test("^(tasks/received|tasks/done|reports/.*-result\\.md|notify)"))) | join(", ")')
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh pr comment "$pr" --repo "$REPO" --body "[알림] ${now} 커밋 ${SHA:0:7}: ${title}
          파일: ${files}"
